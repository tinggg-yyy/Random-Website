<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/// ⏃⎅⟟⎅⏃⌇ /// A D I D A S /// ⏃⎅⟟⎅⏃⌇ ///</title>
    <style>
        /* 绝对禁止黑白灰，仅使用红、紫、绿及其派生透明度 */
        :root {
            --r: #FF0000;
            --p: #800080;
            --g: #00FF00;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(45deg, var(--r), var(--p), var(--g), var(--r));
            background-size: 400% 400%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            animation: alienBg 2s infinite alternate ease-in-out;
            perspective: 500px;
            cursor: crosshair;
        }

        /* 空间扭曲容器 */
        #chaos-matrix {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            transform-style: preserve-3d;
            z-index: 10;
        }

        /* 异星磨砂玻璃碎片 */
        .glass-shard {
            position: absolute;
            background: rgba(128, 0, 128, 0.3); /* 紫色透镜 */
            backdrop-filter: blur(25px) contrast(200%) hue-rotate(90deg);
            -webkit-backdrop-filter: blur(25px) contrast(200%);
            border: 3px solid rgba(0, 255, 0, 0.5); /* 绿色边缘 */
            box-shadow: 0 0 30px var(--r), inset 0 0 40px var(--g);
            mix-blend-mode: hard-light;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 疯狂的三叶草 (由三个交叉的椭圆组成) */
        .trefoil {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            mix-blend-mode: difference;
        }
        .leaf {
            width: 50px; height: 80px;
            background: var(--g);
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
            box-shadow: 0 0 50px var(--p);
        }
        .leaf:nth-child(1) { transform: rotate(-40deg) translateX(-30px); background: var(--r); }
        .leaf:nth-child(2) { height: 100px; bottom: 30px; background: var(--p); z-index: 2; }
        .leaf:nth-child(3) { transform: rotate(40deg) translateX(30px); background: var(--g); }
        .trefoil-stripes {
            position: absolute;
            bottom: 0;
            width: 120px;
            height: 30px;
            background: repeating-linear-gradient(to top, transparent, transparent 5px, var(--r) 5px, var(--r) 12px);
            z-index: 5;
        }

        /* 无规则游走的三条杠 */
        .rogue-stripes {
            position: absolute;
            display: flex;
            gap: 15px;
            mix-blend-mode: color-dodge;
        }
        .r-stripe {
            width: 20px; height: 300px;
            background: var(--p);
            box-shadow: 0 0 20px var(--r), 0 0 40px var(--g);
            transform: skewX(-25deg);
        }

        /* 精神污染乱码文本 */
        .glitch-text {
            position: absolute;
            font-size: 5rem;
            font-weight: 900;
            color: var(--g);
            text-shadow: 5px 5px 0px var(--r), -5px -5px 0px var(--p);
            white-space: nowrap;
            mix-blend-mode: exclusion;
            pointer-events: none;
        }

        /* 核心动画 */
        @keyframes alienBg {
            0% { background-position: 0% 50%; filter: saturate(200%) hue-rotate(0deg); }
            100% { background-position: 100% 50%; filter: saturate(300%) hue-rotate(90deg) invert(20%); }
        }

        @keyframes psychoSpin {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
            33% { transform: rotateX(180deg) rotateY(-90deg) rotateZ(45deg) scale(1.5); }
            66% { transform: rotateX(-90deg) rotateY(270deg) rotateZ(-180deg) scale(0.5); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg) scale(1); }
        }

        @keyframes glitchWarp {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-10px, 10px) skewX(20deg); }
            20% { clip-path: inset(80% 0 10% 0); transform: translate(10px, -10px) skewX(-20deg); }
            40% { clip-path: inset(40% 0 40% 0); transform: translate(-10px, -10px) scaleY(1.5); }
            60% { clip-path: inset(0% 0 90% 0); transform: translate(10px, 10px) scaleX(0.5); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(-5px, 5px) skewY(15deg); }
            100% { clip-path: inset(20% 0 50% 0); transform: translate(0, 0) skewX(0); }
        }
    </style>
</head>
<body>

    <div id="chaos-matrix"></div>

    <script>
        const matrix = document.getElementById('chaos-matrix');
        const alienChars = "⏃⎅⟟⎅⏃⌇⏁⊑⍀⟒⟒⌇⏁⍀⟟⌿⟒⌇☊⌰⍜⎐⟒⍀///";
        const baseWords = ["ADIDAS", "///", "THREE STRIPES", "EUPHORIA", "TREFOIL"];
        const colors = ['var(--r)', 'var(--p)', 'var(--g)'];

        // 生成极度混乱的随机数
        const R = (min, max) => Math.random() * (max - min) + min;

        // 1. 生成磨砂玻璃异星碎片
        for(let i = 0; i < 30; i++) {
            let shard = document.createElement('div');
            shard.className = 'glass-shard';
            shard.style.width = `${R(100, 400)}px`;
            shard.style.height = `${R(100, 400)}px`;
            shard.style.borderRadius = `${R(0,50)}% ${R(0,50)}% ${R(0,50)}% ${R(0,50)}%`;
            shard.style.left = `${R(-1000, 1000)}px`;
            shard.style.top = `${R(-1000, 1000)}px`;
            shard.style.animation = `psychoSpin ${R(2, 8)}s infinite cubic-bezier(${R(0,1)},${R(0,1)},${R(0,1)},${R(0,1)}) alternate`;
            
            // 碎片内部随机嵌入三条杠或乱码
            if(Math.random() > 0.5) {
                shard.innerHTML = `<div class="rogue-stripes" style="transform: scale(${R(0.3, 1)})">
                    <div class="r-stripe" style="background:${colors[Math.floor(R(0,3))]}; height: ${R(100, 300)}px"></div>
                    <div class="r-stripe" style="background:${colors[Math.floor(R(0,3))]}; height: ${R(100, 300)}px"></div>
                    <div class="r-stripe" style="background:${colors[Math.floor(R(0,3))]}; height: ${R(100, 300)}px"></div>
                </div>`;
            }
            matrix.appendChild(shard);
        }

        // 2. 生成三叶草爆炸矩阵
        for(let i = 0; i < 20; i++) {
            let trefoil = document.createElement('div');
            trefoil.className = 'trefoil';
            trefoil.style.left = `${R(-800, 800)}px`;
            trefoil.style.top = `${R(-800, 800)}px`;
            trefoil.style.transform = `scale(${R(0.5, 3)}) rotateZ(${R(0, 360)}deg)`;
            trefoil.style.animation = `psychoSpin ${R(1, 5)}s infinite reverse`;
            trefoil.innerHTML = `
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="trefoil-stripes"></div>
            `;
            matrix.appendChild(trefoil);
        }

        // 3. 乱码文本植入脑海
        let textNodes = [];
        for(let i = 0; i < 25; i++) {
            let txt = document.createElement('div');
            txt.className = 'glitch-text';
            txt.style.left = `${R(-1200, 1200)}px`;
            txt.style.top = `${R(-1000, 1000)}px`;
            txt.style.transform = `rotate(${R(-180, 180)}deg)`;
            txt.style.animation = `glitchWarp ${R(0.1, 0.5)}s infinite linear`;
            matrix.appendChild(txt);
            textNodes.push(txt);
        }

        // 高频轮询：让文本在地球语言和外星乱码中疯狂切换，强行洗脑 Adidas
        setInterval(() => {
            textNodes.forEach(node => {
                if(Math.random() > 0.4) {
                    node.innerText = baseWords[Math.floor(R(0, baseWords.length))];
                    node.style.color = colors[Math.floor(R(0,3))];
                } else {
                    let gibberish = "";
                    for(let j=0; j<R(3, 10); j++) gibberish += alienChars[Math.floor(R(0, alienChars.length))];
                    node.innerText = gibberish;
                }
                // 随机颠倒
                if(Math.random() > 0.8) node.style.transform += ` scaleX(-1) scaleY(-1)`;
            });
        }, 50);

        // 4. 音画交互模拟 (跟随鼠标/触控形成空间爆炸扭曲)
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        function renderChaos() {
            // 利用鼠标位置制造极度夸张的 3D 视角翻转，模拟音浪轰炸感
            matrix.style.transform = `
                rotateX(${mouseY * 360}deg) 
                rotateY(${mouseX * 360}deg) 
                translateZ(${Math.abs(mouseX * mouseY) * 1000}px)
                scale(${1 + Math.abs(mouseX * 0.5)})
            `;
            requestAnimationFrame(renderChaos);
        }
        renderChaos();

        // 5. 点击引发三条杠维度崩溃
        document.addEventListener('click', () => {
            document.body.style.filter = `invert(100%) hue-rotate(${R(0, 360)}deg)`;
            setTimeout(() => { document.body.style.filter = 'none'; }, 100);
        });
    </script>
</body>
</html>
